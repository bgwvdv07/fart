<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSS Monitor</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --panel-2: #1d212b;
      --text: #f5f7fb;
      --muted: #98a2b3;
      --accent: #7c5cff;
      --border: rgba(255,255,255,0.08);
      --shadow: 0 16px 40px rgba(0,0,0,0.28);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(124,92,255,0.18), transparent 30%),
        radial-gradient(circle at top right, rgba(0,209,255,0.12), transparent 22%),
        var(--bg);
      color: var(--text);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(14px);
      background: rgba(15,17,21,0.72);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
    }

    .topbar-inner {
      max-width: 1400px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 1.4rem;
      letter-spacing: -0.02em;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .controls label {
      font-size: 0.9rem;
      color: var(--muted);
    }

    .controls select,
    .controls input,
    .controls button {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 0.95rem;
    }

    .controls button {
      cursor: pointer;
      background: linear-gradient(135deg, #7c5cff, #5a7cff);
      border: none;
      font-weight: 600;
    }

    .controls button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .meta {
      max-width: 1400px;
      margin: 14px auto 0;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .gallery-wrap {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }

    .gallery {
      column-count: 5;
      column-gap: 16px;
    }

    .tile {
      break-inside: avoid;
      margin: 0 0 16px;
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      display: block;
      text-decoration: none;
      color: inherit;
      transition: transform 180ms ease, box-shadow 180ms ease;
      position: relative;
    }

    .tile:hover {
      transform: translateY(-4px);
      box-shadow: 0 24px 48px rgba(0,0,0,0.34);
    }

    .tile-media {
      width: 100%;
      position: relative;
      background: linear-gradient(135deg, #232938, #131722);
      overflow: hidden;
      min-height: 180px;
    }

    .tile-media img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    /* Title overlay */
    .tile-title-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(0, 0, 0, 0.55);
      color: var(--text);
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
      text-align: center;
    }

    .tile-title-overlay h2 {
      margin: 0;
      font-size: 0.95rem;
      line-height: 1.35;
      font-weight: 600;
    }

    .tile:hover .tile-title-overlay {
      opacity: 1;
    }

    .tile-placeholder {
      display: flex;
      align-items: end;
      justify-content: start;
      min-height: 220px;
      padding: 18px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.25)),
        linear-gradient(135deg, #252b3a, #161b24 58%, #10131a);
    }

    .tile-placeholder span {
      display: inline-block;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.72);
      background: rgba(255,255,255,0.08);
      padding: 7px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .tile-body {
      padding: 14px 14px 16px;
    }

    /* Hide summary completely */
    .tile-summary {
      display: none;
    }

    .tile-title-below {
      margin: 0 0 8px;
      font-size: 0.98rem;
      line-height: 1.35;
      /* Optional: if you also want to hide the non-hover title, set display:none */
      /* display: none; */
    }

    .tile-footer {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 60px 20px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    @media (max-width: 1280px) {
      .gallery { column-count: 4; }
    }

    @media (max-width: 980px) {
      .gallery { column-count: 3; }
    }

    @media (max-width: 680px) {
      .gallery { column-count: 2; }
      .topbar { padding: 14px; }
      .gallery-wrap { padding: 14px; }
      .meta { padding: 0 14px; }
    }

    @media (max-width: 460px) {
      .gallery { column-count: 1; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <h1>RSS Monitor</h1>
      <div class="controls">
        <label for="feedSelect">Feed</label>
        <select id="feedSelect">
          <option value="">All feeds</option>
        </select>

        <label for="minScoreInput">Min score</label>
        <input id="minScoreInput" type="number" step="0.1" value="0.5">

        <button id="refreshBtn">Refresh</button>
        <button id="prevBtn">Previous</button>
        <button id="nextBtn">Next</button>
      </div>
    </div>
  </div>

  <div class="meta">
    <p id="status">Ready</p>
    <p id="pageInfo"></p>
  </div>

  <div class="gallery-wrap">
    <div id="gallery" class="gallery"></div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
